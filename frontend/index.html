<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Daily Focus</title>

<link
rel="stylesheet"
href="styles.css">

</head>

<body>

<div class="container">

<header>

<h1>

☀ Daily Focus

</h1>

<p>

Plan today. Finish strong.

</p>

</header>



<div class="top">

<input

id="taskInput"

placeholder="Add today's task">

<button

onclick="addTask()">

Add

</button>

</div>



<div class="progressCard">

<div class="progressInfo">

<span>Progress</span>

<span id="percent">

0%

</span>

</div>

<div class="progress">

<div
id="bar"
class="bar">

</div>

</div>

</div>



<div
id="taskList">

</div>



<div
id="message">

</div>

</div>

<script src="index.js">

</script>

</body>

</html>
